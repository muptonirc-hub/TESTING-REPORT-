<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Your exercise program · BASE Health Noosa</title>
<script>
// Programs given before the move: the link or QR code (or a home-screen icon) opens the same program at the new address.
// The key after # never reaches a server; without one, the last program opened on this phone.
(function () {
  var NEW_PAGE = 'https://base-health-report.web.app/my-program/', KEY_RE = /^[A-Za-z0-9]{20,64}$/;
  var h = String(location.hash || '').replace(/^#/, ''), m = /(?:^|&)k=([A-Za-z0-9]+)/.exec(h), key = m ? m[1] : h;
  if (!KEY_RE.test(key)) { try { key = JSON.parse(localStorage.getItem('bh-program-key')); } catch (e) { key = ''; } }
  var gone = false, go = function () { if (!gone) { gone = true; location.replace(NEW_PAGE + (KEY_RE.test(String(key || '')) ? '#' + key : '')); } };
  // the old page's offline copy on this phone is no longer needed: remove it on the way (at most a moment's wait)
  try {
    if (navigator.serviceWorker && window.caches) {
      setTimeout(go, 1500);
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { return caches.keys(); })
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .then(go, go);
      return;
    }
  } catch (e) { /* fine */ }
  go();
})();
</script>
