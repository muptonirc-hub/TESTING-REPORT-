<!--
  v35: a client's exercise program on their phone (Matthew, 4 Oct: "The exercises prescribed would also be even better
  if it showed up on an app the patient COULD download or use via HTML like we are now"; his choices: a private link and
  QR code, the program only in this first version, the link working until four weeks after the next review).
  The link carries a random 24-character key after # (so it never reaches a server's logs); the page asks the clinic
  store for shared/<key>, which the store's rules give to anyone holding the key until the copy's expiry date, and to no
  one after it or once the clinic stops sharing. What the page shows: the client's first name, the clinician, the
  program as on the handout (title, Why this plan, instructions, block, next review, each exercise with its dose, notes,
  cues, photo and video). The last copy is kept on the phone, so it opens without a connection (videos need one).
  No cookies, analytics or tracking.
-->
<style>
@font-face { font-family: "Rajdhani"; font-weight: 700; font-display: swap; src: url("../athlete-report-app/rajdhani-700.woff2") format("woff2"); }
:root {
  --brand: #448EEE; --accent: #2E70E2; --bg: #ECF0F1; --surface: #FFFFFF; --field: #F5F7F8; --line: #DCE2E6;
  --fg: #202020; --muted: #5F6B75; --bar: #1E1F21; --band: #1E1F21; --soft: #EEF4FE; --amber-soft: #FFF4DB; --amber-ink: #7A4B00;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-brand: "Rajdhani", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --brand: #5A9BFF; --accent: #5A9BFF; --bg: #111417; --surface: #181C21; --field: #1E242A; --line: #293037;
    --fg: #E6E9EC; --muted: #98A4AD; --bar: #0B0D0F; --band: #232A33; --soft: #17253A; --amber-soft: #3A2C10; --amber-ink: #F5CF85; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--font); }
.bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; background: var(--bar); color: #fff; }
.bar .logo { height: 30px; width: auto; color: #fff; --brand: #448EEE; }
main { max-width: 720px; margin: 0 auto; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 32px); overflow-wrap: anywhere; }
h1 { margin: 0 0 4px; font: 700 30px/1.08 var(--font-brand); letter-spacing: .2px; text-transform: uppercase; text-wrap: balance; }
.by { margin: 0; color: var(--muted); font-size: 15px; }
.title { margin: 18px 0 6px; font-size: 21px; line-height: 1.25; font-weight: 700; }
.cover { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 15px; }
.cover b { color: var(--accent); font-weight: 650; }
.box { margin: 16px 0 0; padding: 12px 14px; border-left: 4px solid var(--brand); border-radius: 0 12px 12px 0; background: var(--surface); }
.box h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); }
.box p { margin: 0; white-space: pre-line; }
.box p + h2 { margin-top: 12px; }
.day { margin: 26px 0 10px; padding: 9px 14px; border-radius: 10px; background: var(--band); color: #fff; font: 700 18px/1.2 var(--font-brand); letter-spacing: .5px; text-transform: uppercase; }
.ex { margin: 12px 0 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.ex-media { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; background: var(--field); }
.ex-media img, .ex-media video { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; }
.ex-media img { background: var(--field); }
.ex-body { padding: 12px 14px 14px; }
.ex h3 { margin: 0; font-size: 19px; line-height: 1.3; }
.dose { margin: 4px 0 0; font-size: 16.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { margin: 6px 0 0; }
.cues { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 15.5px; }
.cues li + li { margin-top: 2px; }
.watch { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 10px; padding: 8px 16px; border-radius: 11px; border: 1px solid var(--line); background: var(--field); color: var(--fg); font-weight: 650; text-decoration: none; }
.watch svg { width: 16px; height: 16px; color: var(--accent); }
.state { margin: 28px 0; padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.state h1 { font-size: 24px; }
.state p { margin: 8px 0 0; }
.offline { margin: 0 0 14px; padding: 8px 12px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-ink); font-size: 14.5px; font-weight: 600; }
.tip { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; }
.tip p { flex: 1; margin: 0; }
.tip button { flex: none; min-height: 44px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--accent); font: inherit; font-weight: 650; cursor: pointer; }
.install { display: none; min-height: 44px; margin-top: 10px; padding: 8px 16px; border: 0; border-radius: 11px; background: var(--accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
.install.retry { display: inline-flex; align-items: center; }
.foot { margin: 28px 0 0; color: var(--muted); font-size: 13.5px; }
.loading { color: var(--muted); }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
@media (min-width: 640px) {
  .ex { display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  .ex-media { height: 100%; min-height: 195px; aspect-ratio: auto; }
  .ex.nomedia { display: block; }
}
</style>
